name: gorraharja

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gorraharja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gorraharja"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend-go
    env_file:
      - path: ./backend-go/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gorraharja?sslmode=disable
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
